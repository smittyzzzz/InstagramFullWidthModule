
name: Build Instagram Full Width Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -o InstagramFullWidthModule-source.zip -d /tmp/project
          cp -a /tmp/project/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Instagram-FullWidth-APK
          path: app/build/outputs/apk/debug/app-debug.apk
